<header>
  <h1>光谱&结局坐标图生成器</h1>
</header>

<main>
  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="xqo5b4t" width="640" height="400"></canvas>
    </div>
    <div class="meta">
      <span id="xyrubw7">底图：未导入</span>
      <span id="xlkxnfl">输出：—</span>
    </div>

    <div class="action-bar">
      <div class="action-group">
        <span class="action-label">导出</span>
        <input type="text" id="xddt25f" class="mini" inputmode="decimal" value="1"
          title="放大倍率，可填小数，如 2 或 1.5">
        <span class="val" id="xiu05ic" style="min-width:auto;color:var(--accent);font-weight:600;">1×</span>
        <button type="button" class="ghost scale-preset" data-scale="1">1×</button>
        <button type="button" class="ghost scale-preset" data-scale="2">2×</button>
        <button type="button" class="ghost scale-preset" data-scale="3">3×</button>
        <button type="button" class="ghost scale-preset" data-scale="4">4×</button>
        <button id="xuda9ar" class="primary">导出 PNG</button>
      </div>
      <div class="action-divider"></div>
      <div class="action-group">
        <span class="action-label">配置包</span>
        <button id="x8gcw5w" type="button" class="ghost">打包导出</button>
        <button id="x74zpal" type="button" class="ghost">导入配置</button>
        <input type="file" id="xjmsab3" accept=".zip,application/zip" hidden>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="panel">
      <div class="drop" id="xvn0sbg">点击导入底图 · 或拖入图片</div>
      <input type="file" id="xn1y86q" accept="image/*" hidden>

      <div class="section-title" data-collapsible><span class="arrow">▸</span><span>网格</span></div>
      <div class="row">
        <label for="xwz15un">格子数</label>
        <select id="xwz15un" class="grow">
          <option value="3">3 × 3</option>
          <option value="4">4 × 4</option>
          <option value="5" selected>5 × 5</option>
          <option value="6">6 × 6</option>
          <option value="7">7 × 7</option>
          <option value="8">8 × 8</option>
          <option value="9">9 × 9</option>
          <option value="10">10 × 10</option>
        </select>
      </div>
      <div class="row">
        <label for="xggyyt6">间距</label>
        <div class="dual">
          <input type="range" id="xdkx5gy" min="0" max="200" step="1" value="8">
          <input type="number" id="xggyyt6" min="0" step="1" value="8" title="也可直接输入">
        </div>
      </div>
      <div class="row">
        <label for="x5keghg">格子边长</label>
        <div class="dual">
          <input type="range" id="xthjxdh" min="0" max="800" step="1" value="150">
          <input type="number" id="x5keghg" min="0" step="1" value="150" title="0 = 自动">
        </div>
      </div>
      <div class="hint" id="xrk7g3l" style="margin:-6px 0 10px 74px; color:#e8a33d; display:none;"></div>

      <div class="section-title" data-collapsible><span class="arrow">▸</span><span>网格内编辑</span></div>
      <div class="row">
        <label style="display:flex;align-items:center;gap:8px;min-width:auto;cursor:pointer;">
          <input type="checkbox" id="xuqi4tp">
          <span style="color:var(--text);">开启格子编辑（点击预览选中格子）</span>
        </label>
      </div>
      <div id="x0c11ff" style="display:none;">
        <div class="hint" id="x99tgl1" style="margin:0 0 10px 0;">尚未选中格子：点一下预览里的格子。</div>
        <div id="xiioxqk" style="display:none;">
          <div class="row" style="align-items:flex-start;">
            <label for="xzddnvr" style="padding-top:7px;">格内文字</label>
            <textarea id="xzddnvr" class="grow" rows="2" maxlength="200"
              placeholder="回车可换行" style="resize:vertical; min-height:48px;"></textarea>
          </div>
          <div class="row">
            <label>格内图片</label>
            <div class="grow" style="display:flex; gap:6px; flex-wrap:wrap;">
              <button type="button" id="x3ilwkk" class="ghost"
                style="width:auto; padding:5px 10px; font-size:12px;">选择图片</button>
              <button type="button" id="x8ral1t" class="ghost"
                style="width:auto; padding:5px 10px; font-size:12px;">清除</button>
              <span id="xepddfn" style="font-size:12px;color:var(--muted);align-self:center;">无</span>
            </div>
          </div>
          <input type="file" id="x1aafr9" accept="image/*" hidden>
          <div class="row" id="xxghjjj" style="display:none;">
            <button type="button" id="xqdztib" class="ghost"
              style="width:auto; padding:5px 10px; font-size:12px;">裁剪（框选区域）</button>
            <span id="x5wd6vw" style="font-size:12px;color:var(--muted);align-self:center;"></span>
          </div>
          <div class="row">
            <button type="button" id="xcxsysi" class="ghost"
              style="width:auto; padding:7px 10px; font-size:12px;">移动到…（点画布选目标格）</button>
          </div>
          <div class="hint" id="xr2n0tq" style="margin:-6px 0 10px 0; display:none; color:var(--accent);">
            已进入移动模式：点预览里的目标格子完成移动，或点「取消」。
          </div>
          <div class="row" id="xfo2gwi" style="display:none;">
            <button type="button" id="xlwsf5z" class="ghost"
              style="width:auto; padding:7px 10px; font-size:12px;">取消移动</button>
          </div>
          <div class="row">
            <button type="button" id="xn5son8" class="ghost"
              style="width:auto; padding:7px 10px; font-size:12px;">清空此格</button>
            <span class="grow"></span>
            <span id="xkq91sd" style="font-size:12px;color:var(--muted);"></span>
          </div>
        </div>
      </div>

      <div class="hint" id="xcmjzxv" style="margin:8px 0 12px 0;">画布随屏幕自适应（保持正方形），导出尺寸在下方单独设置。</div>

      <div class="section-title" data-collapsible><span class="arrow">▸</span><span>描边</span></div>
      <div class="row">
        <label style="display:flex;align-items:center;gap:8px;min-width:auto;cursor:pointer;">
          <input type="checkbox" id="xf3u9wk" checked>
          <span style="color:var(--text);">格子描边</span>
        </label>
        <span class="grow"></span>
        <input type="color" id="xj2u0bt" value="#ffffff" title="描边颜色">
        <input type="text" id="xqwc0ac" class="hex-input" value="#ffffff" maxlength="7" spellcheck="false" title="十六进制颜色，如 #ffffff">
      </div>
      <div class="row">
        <label for="xa8vhhh">线宽</label>
        <div class="dual">
          <input type="range" id="xcqugzn" min="1" max="100" step="1" value="2">
          <input type="number" id="xa8vhhh" min="1" step="1" value="2">
        </div>
      </div>

      <div class="section-title" data-collapsible id="xwv5i11" style="display:none;"><span class="arrow">▸</span><span>中轴十字</span></div>
      <div class="row" id="xgimzfl" style="display:none;">
        <label style="display:flex;align-items:center;gap:8px;min-width:auto;cursor:pointer;">
          <input type="checkbox" id="xgvrd3a">
          <span style="color:var(--text);">显示中轴（横竖各一条）</span>
        </label>
      </div>
      <div id="x8xlcah" style="display:none;">
        <div class="row">
          <label for="x0bl8pl">轴粗</label>
          <div class="dual">
            <input type="range" id="xfyfbx6" min="1" max="100" step="1" value="3">
            <input type="number" id="x0bl8pl" min="1" step="1" value="3">
          </div>
        </div>
        <div class="row">
          <label for="xemk4x1">箭头</label>
          <div class="dual">
            <input type="range" id="xrahpx5" min="2" max="200" step="1" value="14">
            <input type="number" id="xemk4x1" min="2" step="1" value="14">
          </div>
        </div>
        <div class="hint" style="margin:-6px 0 10px 74px;">只在偶数格时可用</div>
      </div>

      <div class="section-title collapsible" id="xk5h1t9" style="cursor:pointer; user-select:none; display:flex; align-items:center; gap:6px;">
        <span class="arrow">▸</span>
        <span>文字样式</span>
      </div>
      <div id="x42u71v" class="section-body">
        <div class="row">
          <label style="display:flex;align-items:center;gap:8px;min-width:auto;cursor:pointer;">
            <input type="checkbox" id="xqkh5x9">
            <span style="color:var(--text);">加粗</span>
          </label>
          <span class="grow"></span>
          <label style="display:flex;align-items:center;gap:8px;min-width:auto;cursor:pointer;">
            <input type="checkbox" id="x73h582">
            <span style="color:var(--text);">斜体</span>
          </label>
        </div>
        <div class="row">
          <label for="xbol4sb">文字颜色</label>
          <span class="grow"></span>
          <input type="color" id="xbol4sb" value="#ffffff" title="文字颜色">
          <input type="text" id="x75bv2k" class="hex-input" value="#ffffff" maxlength="7" spellcheck="false" title="十六进制颜色">
        </div>
        <div class="row">
          <label style="display:flex;align-items:center;gap:8px;min-width:auto;cursor:pointer;">
            <input type="checkbox" id="x55cl50" checked>
            <span style="color:var(--text);">文字描边</span>
          </label>
          <span class="grow"></span>
          <input type="color" id="xrh06qx" value="#000000" title="描边颜色">
          <input type="text" id="x3gzvjo" class="hex-input" value="#000000" maxlength="7" spellcheck="false" title="十六进制颜色">
        </div>
        <div class="row">
          <label for="xa7kdje">描边粗细</label>
          <div class="dual">
            <input type="range" id="xd5zdwf" min="0" max="40" step="1" value="8">
            <input type="number" id="xa7kdje" min="0" step="1" value="8">
            <span class="val" style="min-width:auto;">%</span>
          </div>
        </div>
        <div class="row">
          <label for="xho0imi">字体</label>
          <select id="xho0imi" class="grow">
            <option value="sans" selected>系统无衬线（黑体）</option>
            <option value="serif">系统衬线（宋体）</option>
            <option value="mono">系统等宽</option>
            <option value="custom">自定义字体名…</option>
            <option value="file">上传字体文件…</option>
          </select>
        </div>
